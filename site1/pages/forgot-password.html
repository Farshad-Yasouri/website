<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازیابی رمز عبور</title>

  <link rel="stylesheet" href="/assets/css/forgot-password.css">
</head>

<body>
  <main class="card">
    <div class="icon" aria-hidden="true">🔐</div>

    <h1>بازیابی رمز عبور</h1>

    <p class="description">
      شماره تلفن حساب کاربری خود را وارد کنید تا کد بازیابی دریافت کنید.
    </p>

    <form id="forgotPasswordForm" novalidate>
      <label for="phone">شماره تلفن</label>

      <input
        id="phone"
        name="phone"
        type="text"
        placeholder="09123456789"
        autocomplete="tel"
        maxlength="11"
        required
      >

      <button id="submitButton" type="submit">
        دریافت کد بازیابی
      </button>

      <div id="message" class="message" role="alert"></div>
      <div id="otpSection" style="display: none;">
  <label for="otp">کد بازیابی</label>

  <input
    id="otp"
    name="otp"
    type="text"
    placeholder="کد شش‌رقمی"
    maxlength="6"
    inputmode="numeric"
  >

  <button id="verifyButton" type="button">
    تأیید کد
  </button>
</div>

<div id="passwordSection" style="display: none;">
  <label for="newPassword">رمز عبور جدید</label>

  <input
    id="newPassword"
    name="newPassword"
    type="password"
    placeholder="حداقل ۶ کاراکتر"
    minlength="6"
  >

  <button id="resetButton" type="button">
    تغییر رمز عبور
  </button>
</div>
    </form>

    <a class="back-link" href="/index.html">
      بازگشت به صفحه ورود
    </a>

    <p class="security-note">
      کد بازیابی فقط یک‌بار قابل استفاده است و مدت محدودی اعتبار دارد.
    </p>
  </main>

  <script src="/assets/js/forgot-password.js"></script>
</body>
</html>
