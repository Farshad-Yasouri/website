<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>palette of color</title>
  <style>
    @font-face {
    font-family: "Vazir";
    src: url("/fonts/Vazir.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Vazir", sans-serif;
  }

  header {
    margin: 3px;
    padding: 8px;
    border: 1px solid rgb(142, 40, 40);
    background-color: antiquewhite;
    border-radius: 10px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .button {
    width: 20px;
    height: 20px;
    padding: 0;
    border: 2px solid black;
    border-radius: 50%;
    cursor: pointer;
  }

  h1 {
    margin: 0;
    font-size: 20px;
    white-space: nowrap;
  }

  .withimg {
    width: 100%;
    padding: 0 3px;
    margin: 10px 0;

    display: flex;
    align-items: stretch;
    gap: 10px;
  }

  .pallet-color,
  .img {
    width: 50%;
    aspect-ratio: 1 / 1;

    border: 1px solid black;
    border-radius: 10px;
    overflow: hidden;
  }

  .pallet-color {
    background-color: #C7DC9E;
  }

  .img {
    background-color: white;
  }

  .img img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .butterfly-green {
    background-color: #C7DC9E;
  }

  .vampire-kiss {
    background-color: #711D20;
  }

  .witches-brew {
    background-color: #421C35;
  }

  .tangerine-tango {
    background-color: #E33D20;
  }

  .spiced-apple {
    background-color: #7F3B3C;
  }

  .polar-wind {
    background-color: #AED3EA;
  }

  .elephants-breath {
    background-color: #C9C1B7;
  }

  @media (max-width: 600px) {
    header {
      flex-wrap: wrap;
      justify-content: center;
    }

    h1 {
      order: -1;
      width: 100%;
      text-align: center;
    }

    .withimg {
      flex-direction: column;
    }

    .pallet-color,
    .img {
      width: 100%;
    }
  }
  </style>
</head>
<body>
  <header>
    <div class="group">
      <button class="button butterfly-green" onclick="setColor('#C7DC9E', 'images/butterfly-green.jpg')"></button>
      <button class="button vampire-kiss" onclick="setColor('#711D20', 'images/vampire-kiss.jpg')"></button>
      <button class="button witches-brew" onclick="setColor('#421C35', 'images/witches-brew.jpg')"></button>
      <button class="button tangerine-tango" onclick="setColor('#E33D20', 'images/tangerine-tango.jpg')"></button>
    </div>

    <h1>چند رنگ زیبا</h1>

    <div class="group">
      <button class="button spiced-apple" onclick="setColor('#7F3B3C', 'images/spiced-apple.jpg')"></button>
      <button class="button polar-wind" onclick="setColor('#AED3EA', 'images/polar-wind.jpg')"></button>
      <button class="button elephants-breath" onclick="setColor('#C9C1B7', 'images/elephants-breath.jpg')"></button>
    </div>
  </header>

    <div class="withimg">
      <div class="img">
      <img src="images/butterfly-green.jpg" alt="">
    </div>
    <div class="pallet-color"></div>
    
  </div>

  <script>
    function setColor(color, imgSrc) {
      document.querySelector('.pallet-color').style.backgroundColor = color;
      document.querySelector('.withimg .pallet-color').style.backgroundColor = color;
      document.querySelector('.img img').src = imgSrc;
    }
  </script>
</body>
</html>
